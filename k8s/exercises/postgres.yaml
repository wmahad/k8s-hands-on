apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres
  namespace: exercises
data:
  POSTGRES_USER: pingpong
  POSTGRES_DB: pingpong
  PGDATA: /var/lib/postgresql/data/pgdata
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: pingpong
  PGDATABASE: pingpong
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: exercises
type: Opaque
stringData:
  POSTGRES_PASSWORD: pingpong-secret
  PGPASSWORD: pingpong-secret
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: exercises
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: exercises
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: postgres
            - secretRef:
                name: postgres
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
