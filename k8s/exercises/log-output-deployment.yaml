apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: logs
          emptyDir: {}
        - name: config
          configMap:
            name: log-output
            items:
              - key: information.txt
                path: information.txt
      containers:
        - name: log-writer
          image: log-output:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "writer.js"]
          envFrom:
            - configMapRef:
                name: log-output
          volumeMounts:
            - name: logs
              mountPath: /shared
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: log-output
          image: log-output:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: log-output
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: logs
              mountPath: /shared
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
