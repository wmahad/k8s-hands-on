apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres.yaml
  - todo-app.yaml
  - todo-backend.yaml
  - ingress.yaml
configMapGenerator:
  - name: wiki-todo
    namespace: project
    files:
      - wiki-todo.sh
    literals:
      - WIKI_RANDOM_URL=https://en.wikipedia.org/wiki/Special:Random
      - WIKI_ORIGIN=https://en.wikipedia.org
      - TODOS_URL=http://todo-backend:3000/todos
    options:
      disableNameSuffixHash: true
