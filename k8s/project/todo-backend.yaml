apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-backend
  namespace: project
data:
  HOST: "0.0.0.0"
  PORT: "3000"
  TODO_MAX_LENGTH: "140"
---
apiVersion: v1
kind: Service
metadata:
  name: todo-backend
  namespace: project
spec:
  type: ClusterIP
  selector:
    app: todo-backend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do sleep 2; done
          envFrom:
            - configMapRef:
                name: postgres
            - secretRef:
                name: postgres
      containers:
        - name: todo-backend
          image: todo-backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: todo-backend
            - configMapRef:
                name: postgres
            - secretRef:
                name: postgres
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wiki-todo
  namespace: project
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: wiki-todo
              image: curlimages/curl:8.15.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: wiki-todo
              command: ["/bin/sh", "/scripts/wiki-todo.sh"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: wiki-todo
                items:
                  - key: wiki-todo.sh
                    path: wiki-todo.sh

